<meta charset="utf-8">
<title>BEACON GLASS — Lumina Hollywood</title>
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="BEACON — spatial leasing intelligence for Lumina Hollywood. Live vacancy matching and wayfinding for leasing agents, in-lens.">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-96.png" sizes="96x96">
<link rel="icon" href="icon-52.png" sizes="52x52">
<style>
  /* BEACON GLASS v0.2 — in-lens app for Meta Ray-Ban Display.
     600x600 fixed viewport · black = transparent on the additive display.
     Neural Band gestures arrive as key events: ◀▶ requests · ▲▼ units · ⏎ route · ⎋ home
     Building model: Lumina Hollywood, 1522 Gordon St — real plans/pricing, simulated statuses. */
  :root{
    --ink:#EAF8F3; --dim:#7FA79B; --teal:#53E6C4; --amber:#F0B44C; --blue:#7AB8F2;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
    --e-out:cubic-bezier(0,0,.2,1); --e-expo:cubic-bezier(.16,1,.3,1);
    --e-inout:cubic-bezier(.65,0,.35,1); --e-in:cubic-bezier(.4,0,1,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:600px;height:600px;overflow:hidden}
  body{position:relative;font-family:var(--mono);color:var(--ink);-webkit-font-smoothing:antialiased}
  .bar{position:absolute;left:24px;right:24px;display:flex;align-items:baseline;gap:10px}
  .top{top:20px}
  .brand{font-size:17px;font-weight:700;letter-spacing:.3em;color:var(--teal)}
  .site{font-size:11px;letter-spacing:.14em;color:var(--dim)}
  .mode{margin-left:auto;font-size:11px;letter-spacing:.2em;color:var(--dim)}

  .compass{position:absolute;top:104px;left:24px;right:24px;height:26px;overflow:hidden}
  .c-tape{position:absolute;left:50%;top:0;height:100%;white-space:nowrap;transition:transform 300ms var(--e-inout);will-change:transform}
  .c-tick{position:absolute;top:16px;width:1px;height:5px;background:#2A423C}
  .c-tick.major{top:12px;height:9px;background:var(--dim)}
  .c-lbl{position:absolute;top:0;font-size:9px;color:var(--dim);letter-spacing:.1em;transform:translateX(-50%)}
  .c-lbl.n{color:var(--teal);font-weight:700}
  .c-caret{position:absolute;left:50%;top:22px;width:0;height:0;border:4px solid transparent;border-bottom-color:var(--teal);transform:translateX(-4px)}
  .c-hdg{position:absolute;right:0;top:0;font-size:9px;color:var(--teal);letter-spacing:.14em}
  .team{position:absolute;bottom:44px;left:24px;right:24px;font-size:10px;letter-spacing:.12em;color:var(--blue)}
  .team b{color:var(--dim);font-weight:400}
  .req{position:absolute;top:58px;left:24px;right:24px}
  .req .eyebrow{font-size:10px;letter-spacing:.26em;color:var(--dim)}
  .req .text{font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--ink);margin-top:4px;white-space:nowrap}
  .req .text.out{animation:reqOut 100ms var(--e-in) both}
  .req .text.in{animation:reqIn 140ms var(--e-out) both}
  @keyframes reqOut{to{opacity:0;transform:translateY(-6px)}}
  @keyframes reqIn{from{opacity:0;transform:translateY(6px)}}
  .req .pager{position:absolute;right:0;top:16px;font-size:12px;color:var(--dim);letter-spacing:.1em}

  .tower{position:absolute;top:132px;left:24px;width:172px;height:396px}
  .tower svg{width:100%;height:100%}
  .g-cell{fill:none;stroke:#1E2E2A;stroke-width:.6}
  .g-cell.vacant{stroke:var(--teal);stroke-width:.9;fill:rgba(83,230,196,.15)}
  .g-cell.turn{stroke:var(--blue);fill:rgba(122,184,242,.12)}
  .g-cell.notice{stroke:var(--amber);fill:rgba(240,180,76,.12)}
  .g-cell.hit{stroke:var(--teal);stroke-width:1.6;fill:rgba(83,230,196,.5)}
  .g-cell.hit.upcoming{stroke:var(--amber);fill:rgba(240,180,76,.45)}
  .g-cell.amenity{stroke:#233A34;stroke-dasharray:2 1.4}
  .g-lbl{font-family:var(--mono);font-size:8px;fill:var(--dim);letter-spacing:.1em}
  .g-ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s cubic-bezier(0,.55,.45,1) infinite;fill:none;stroke:var(--teal);opacity:0}
  .g-ping.r2{animation-delay:.5s}
  @keyframes ping{0%{transform:scale(.35);opacity:.8;stroke-width:1.6}70%{opacity:0}100%{transform:scale(2.2);opacity:0;stroke-width:.4}}

  .card{position:absolute;top:132px;left:216px;right:24px;height:396px;display:flex;flex-direction:column}
  .rank{font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .rank b{color:var(--teal);font-weight:700}
  .unit{font-size:62px;font-weight:700;letter-spacing:.06em;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
  .plan{font-size:14px;letter-spacing:.12em;color:var(--teal);margin-top:2px}
  .specs{margin-top:14px;display:flex;flex-direction:column;gap:8px;font-size:16px;letter-spacing:.06em}
  .specs .row{display:flex;justify-content:space-between}
  .specs .k{color:var(--dim);font-size:12px;letter-spacing:.18em;align-self:center}
  .avail{margin-top:14px;font-size:16px;letter-spacing:.12em;color:var(--teal);font-weight:700}
  .avail.upcoming{color:var(--amber)}
  .why{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.6;letter-spacing:.03em}
  .fit{margin-top:auto;display:flex;align-items:center;gap:10px}
  .fitbar{flex:1;height:4px;background:#152420;border-radius:2px;overflow:hidden}
  .fitbar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left;transform:scaleX(var(--sx,1));animation:barFill 450ms var(--e-expo) both}
  @keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(var(--sx,1))}}
  .fitpct{font-size:14px;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}

  .route{position:absolute;top:132px;left:216px;right:24px;height:396px;display:none;flex-direction:column}
  .route.show{display:flex}
  .route .eyebrow{font-size:10px;letter-spacing:.26em;color:var(--dim)}
  .route .to{font-size:32px;font-weight:700;letter-spacing:.08em;color:var(--teal);margin:6px 0 18px}
  .steps{display:flex;flex-direction:column}
  .step{display:flex;gap:14px;align-items:flex-start}
  .step .n{width:26px;height:26px;border:1.5px solid var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--teal);flex:none;
    animation:popIn 180ms cubic-bezier(.34,1.56,.64,1) both}
  @keyframes popIn{from{opacity:0;transform:scale(.6)}}
  .step .t{font-size:16px;letter-spacing:.05em;padding-top:3px;line-height:1.3;animation:stepFade 160ms var(--e-out) both}
  @keyframes stepFade{from{opacity:0}}
  .step .stem{width:1.5px;height:22px;background:#1E3833;margin-left:12.5px;transform-origin:top;animation:stemGrow 140ms var(--e-inout) both}
  @keyframes stemGrow{from{transform:scaleY(0)}}

  .fh{position:absolute;top:132px;left:216px;right:24px;display:none;border:1.5px solid var(--amber);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--amber);letter-spacing:.05em;line-height:1.6}
  .fh.show{display:block}

  .hints{position:absolute;bottom:20px;left:24px;right:24px;display:flex;gap:22px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
  .hints b{color:var(--ink);font-weight:400}
  .hints .sync{margin-left:auto;color:var(--teal)}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
    .g-ping{animation:none;opacity:0}
  }
</style>

<div class="bar top">
  <span class="brand">BEACON</span><span class="site">LUMINA HOLLYWOOD · TOUR 4/9</span>
  <span class="mode">TOUR MODE</span>
</div>

<div class="compass" aria-hidden="true"><div class="c-tape" id="cTape"></div><div class="c-caret"></div><span class="c-hdg" id="cHdg">HDG 000</span></div>

<div class="req">
  <div class="eyebrow">PROSPECT WANTS</div>
  <div class="text" id="reqText">—</div>
  <div class="pager" id="reqPager"></div>
</div>

<div class="tower" id="tower"></div>

<div class="card" id="card"></div>
<div class="route" id="route"></div>
<div class="fh" id="fh">FAIR HOUSING GUARD — protected criteria ignored. Matching on unit attributes only.</div>

<div class="team">TEAM ▸ CHEN <b>L1 LOBBY</b> · POOLE <b>FL 9 TOURING</b> · REYES <b>YOU</b></div>

<div class="bar hints">
  <span><b>◀▶</b> REQUEST</span><span><b>▲▼</b> UNIT</span><span><b>⏎</b> ROUTE</span>
  <span class="sync">● SYNC LIVE</span>
</div>

<script>
'use strict';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---- Lumina Hollywood building model (same spine as the BEACON ops platform) ---- */
const PLANS={'0x1A':{n:'0x1A STUDIO',b:0,ba:1,sf:576,r:2358},'1x1A':{n:'1x1A ONE BED + DEN',b:1,ba:1,sf:690,r:2336},
  '1x1B':{n:'1x1B ONE BED',b:1,ba:1,sf:690,r:2503},'1x1C':{n:'1x1C ONE BED',b:1,ba:1,sf:832,r:2700},
  '1x1D':{n:'1x1D ONE BED',b:1,ba:1,sf:856,r:2750},'1x1E':{n:'1x1E ONE BED',b:1,ba:1,sf:857,r:2958},
  '1x1F':{n:'1x1F ONE BED',b:1,ba:1,sf:885,r:2850},'1x1G':{n:'1x1G ONE BED',b:1,ba:1,sf:935,r:3050},
  '2x1A':{n:'2x1A TWO BED',b:2,ba:1,sf:862,r:3349},'2x1B':{n:'2x1B TWO BED',b:2,ba:1,sf:911,r:3741},
  '2x1C':{n:'2x1C TWO BED',b:2,ba:1,sf:965,r:3261},'2x2A':{n:'2x2A TWO BED CORNER',b:2,ba:2,sf:1171,r:3959},
  '2x2D':{n:'2x2D TWO BED CORNER',b:2,ba:2,sf:1440,r:4900},'2x2E':{n:'2x2E TWO BED GRAND',b:2,ba:2,sf:1506,r:5400}};
const SP={1:'1x1B',2:'2x2D',3:'0x1A',4:'1x1A',5:'1x1E',6:'1x1C',7:'0x1A',8:'2x1A',
  9:'2x2A',10:'2x1C',11:'1x1F',12:'2x1B',13:'1x1G',14:'1x1D',15:'2x2E'};
const STACKS=15, AMENITY=5;
const SPECIAL={'2402':['vacant'],'2309':['vacant'],'2108':['vacant'],'1804':['vacant'],'1503':['vacant'],
  '907':['vacant'],'611':['vacant'],'715':['vacant'],
  '2212':['turn','AUG 8'],'1610':['turn','AUG 5'],'1205':['turn','AUG 12'],'806':['turn','AUG 15'],
  '2415':['notice','SEP 1'],'2001':['notice','SEP 12'],'1713':['notice','AUG 30'],'1314':['notice','SEP 20'],
  '1010':['notice','SEP 5'],'602':['notice','OCT 1'],'1907':['notice','SEP 15'],'505':['model']};
const UNITS=[];
for(let f=24;f>=5;f--)for(let s=1;s<=STACKS;s++){
  if(f===AMENITY&&s===1)continue; // L5 amenity deck — 299 homes
  const pk=SP[s], p=PLANS[pk], id=`${f}${String(s).padStart(2,'0')}`;
  const sp=SPECIAL[id]||['occupied'];
  UNITS.push({id,f,s,pk,...p,rent:Math.round((p.r+(f-5)*12+((s<=5&&f>=15)?40:0))/5)*5,
    status:sp[0],date:sp[1]||null,north:s<=5});
}
const viewTxt=s=>s<=5?'SIGN (N)':s<=8?'GRIFFITH (E)':s<=12?'DTLA (S)':'SUNSET (W)';
const REQS=[
  {label:'TWO BED · TOP FLOOR', beds:2, top:1},
  {label:'ONE BED · HAS DOG', beds:1, dog:1},
  {label:'STUDIO · MOVE-IN ASAP', beds:0, asap:1},
  {label:'SIGN VIEW · UNDER $3.5K', beds:1, north:1, budget:3500},
  {label:'PENTHOUSE · “NO KIDS”', beds:2, top:1, fh:1},
];
function match(rq){
  const out=[];
  for(const u of UNITS){
    if(u.status==='occupied'||u.status==='model')continue;
    if(rq.beds!==undefined&&u.b!==rq.beds)continue;
    if(rq.budget&&u.rent>rq.budget)continue;
    if(rq.asap&&u.status==='notice')continue;
    let sc=40;const why=[];
    if(u.status==='vacant')sc+=30;
    else if(u.status==='turn'){sc+=18;why.push('READY '+u.date)}
    else sc+=6;
    if(rq.top){sc+=Math.round(u.f/24*22);if(u.f>=23)why.push('TOP OF TOWER')}
    if(rq.dog){const d=Math.abs(u.f-AMENITY);sc+=Math.max(0,10-d);
      if(d<=2)why.push('DOG RUN '+(d?d+' FL AWAY':'THIS FLOOR'));why.push('NO PET DEPOSIT')}
    if(rq.north&&u.north){sc+=14;why.push('SIGN EXPOSURE')}
    if(u.f>=23&&u.sf>=1400)why.unshift('GRAND CORNER');
    out.push({u,sc:Math.min(99,sc),why});
  }
  out.sort((a,b)=>b.sc-a.sc||a.u.rent-b.u.rent);
  return out.slice(0,5);
}
/* ---- EagleEye-style compass tape: heading = facing of the selected unit ---- */
const HDG={N:0,E:90,S:180,W:270};
const dirOf=s=>s<=5?'N':s<=8?'E':s<=12?'S':'W';
function buildCompass(){
  const tape=document.getElementById('cTape'); let h='';
  const LBL=['N','NE','E','SE','S','SW','W','NW'];
  for(let deg=-180;deg<=540;deg+=15){
    const x=(deg+180)*2;
    const major=deg%45===0;
    h+=`<span class="c-tick ${major?'major':''}" style="left:${x}px"></span>`;
    if(major){ const d=((deg%360)+360)%360;
      h+=`<span class="c-lbl ${d===0?'n':''}" style="left:${x}px">${LBL[d/45]}</span>`; }
  }
  tape.innerHTML=h;
}
function setHeading(deg){
  document.getElementById('cTape').style.transform=`translateX(${-(deg+180)*2}px)`;
  document.getElementById('cHdg').textContent='HDG '+String(deg).padStart(3,'0');
}
/* ---- render ---- */
let ri=0, ui=0, routeOn=false, lastUnit=null, lastReq=null;
const CW=8.4,CH=14,G=1.4,TX=24,TY=26;
function tower(hits){
  let s=`<svg viewBox="0 0 172 396">`;
  const tw=STACKS*(CW+G)-G;
  s+=`<line x1="${TX-6}" y1="${TY-8}" x2="${TX+tw+6}" y2="${TY-8}" stroke="#1E2E2A" stroke-width="1"/>`;
  for(let f=24;f>=5;f--){
    const y=TY+(24-f)*(CH+G);
    if(f%5===0||f===24)s+=`<text class="g-lbl" x="${TX-8}" y="${y+CH-4}" text-anchor="end">${f}</text>`;
    for(let st=1;st<=STACKS;st++){
      const x=TX+(st-1)*(CW+G);
      if(f===AMENITY&&st===1){s+=`<rect class="g-cell amenity" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="1"/>`;continue}
      const u=UNITS.find(u=>u.f===f&&u.s===st);
      const hit=hits.findIndex(h=>h.u.id===u.id);
      const cls=hit>-1?('hit'+(u.status==='notice'?' upcoming':'')):
        (u.status==='vacant'?'vacant':u.status==='turn'?'turn':u.status==='notice'?'notice':'');
      s+=`<rect class="g-cell ${cls}" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="1"/>`;
      if(hit===ui){
        const cx=x+CW/2, cy=y+CH/2;
        s+=`<circle class="g-ping" cx="${cx}" cy="${cy}" r="7"/><circle class="g-ping r2" cx="${cx}" cy="${cy}" r="7"/>`;
      }
    }
  }
  const gy=TY+20*(CH+G)+4;
  s+=`<line x1="${TX-14}" y1="${gy}" x2="${TX+tw+14}" y2="${gy}" stroke="#2A423C" stroke-width="1.4"/>`;
  s+=`<text class="g-lbl" x="${TX-6}" y="${gy+13}">L1 GORDON ST · ELEV A/B</text>`;
  document.getElementById('tower').innerHTML=s+'</svg>';
}
function scramble(el,final){ // 3-frame digit scramble, numeric readouts only (U18)
  if(REDUCED){ el.textContent=final; return; }
  let n=0;
  (function fr(){
    if(n++>=3){ el.textContent=final; return; }
    el.textContent=final.replace(/\d/g,()=>Math.floor(Math.random()*10));
    setTimeout(fr,40);
  })();
}
function render(reqChanged){
  const rq=REQS[ri], hits=match(rq);
  if(ui>=hits.length)ui=0;
  const rt=document.getElementById('reqText');
  if(reqChanged&&!REDUCED){
    rt.classList.remove('in'); rt.classList.add('out');
    setTimeout(()=>{ rt.textContent=rq.label; rt.classList.remove('out'); rt.classList.add('in'); },100);
  } else rt.textContent=rq.label;
  document.getElementById('reqPager').textContent=`REQ ${ri+1}/${REQS.length}`;
  document.getElementById('fh').classList.toggle('show',!!rq.fh);
  tower(hits);
  const card=document.getElementById('card'), route=document.getElementById('route');
  if(!hits.length){card.innerHTML='<div class="rank">NO EXACT MATCH IN INVENTORY</div>';route.classList.remove('show');return}
  const m=hits[ui],u=m.u,up=u.status==='notice';
  const avail=u.status==='vacant'?'READY NOW':u.status==='turn'?'TURN · READY '+u.date:'NOTICE · AVAIL '+u.date;
  card.innerHTML=`
    <div class="rank">MATCH <b>${ui+1}</b> OF ${hits.length}${up?' · UPCOMING':''}</div>
    <div class="unit" id="unitNum">${u.id}</div>
    <div class="plan">${u.n}</div>
    <div class="specs">
      <div class="row"><span class="k">RENT</span><span>$${u.rent.toLocaleString()}/MO</span></div>
      <div class="row"><span class="k">LAYOUT</span><span>${u.b===0?'STUDIO':u.b+' BD'} / ${u.ba} BA · ${u.sf.toLocaleString()} SF</span></div>
      <div class="row"><span class="k">FLOOR</span><span>FL ${u.f} · ${viewTxt(u.s)}</span></div>
    </div>
    <div class="avail ${up?'upcoming':''}">${avail}</div>
    <div class="why">${m.why.slice(0,3).join(' · ')||'&nbsp;'}</div>
    <div class="fit"><span class="fitbar"><i style="--sx:${m.sc/100}"></i></span><span class="fitpct">${m.sc}%</span></div>`;
  if(u.id!==lastUnit) scramble(document.getElementById('unitNum'),u.id);
  lastUnit=u.id;
  setHeading(HDG[dirOf(u.s)]);
  const bank=u.s<=8?'A':'B', dir=u.s<=8?'RIGHT':'LEFT';
  const floorsUp=u.f-1, eta=Math.round((40+floorsUp*3)/30)*30;
  const etaTxt=eta>=60?`~${Math.round(eta/60)} MIN`:`~${eta} SEC`;
  const steps=[['1','L1 LOBBY — PAST CONCIERGE'],['2','ELEVATOR BANK '+bank],['3','FLOOR '+u.f],['4',dir+' OFF ELEVATOR — END OF HALL']];
  route.innerHTML=`<div class="eyebrow">GUIDE TO</div><div class="to">RES ${u.id}</div>
    <div class="eyebrow" style="margin:-10px 0 14px;color:var(--dim)">${floorsUp} FLOORS UP · EST ${etaTxt} · ${dirOf(u.s)} FACE</div>
    <div class="steps">${steps.map((st,i)=>
      `<div class="step"><span class="n" style="animation-delay:${i*160}ms">${st[0]}</span><span class="t" style="animation-delay:${i*160+60}ms">${st[1]}</span></div>`
      +(i<steps.length-1?`<div class="stem" style="animation-delay:${i*160+120}ms"></div>`:'')).join('')}</div>`;
  route.classList.toggle('show',routeOn);
  card.style.display=routeOn?'none':'flex';
}
addEventListener('keydown',e=>{
  let reqChanged=false;
  if(e.key==='ArrowRight'){ri=(ri+1)%REQS.length;ui=0;routeOn=false;reqChanged=true}
  else if(e.key==='ArrowLeft'){ri=(ri-1+REQS.length)%REQS.length;ui=0;routeOn=false;reqChanged=true}
  else if(e.key==='ArrowDown'){ui++;routeOn=false}
  else if(e.key==='ArrowUp'){ui=Math.max(0,ui-1);routeOn=false}
  else if(e.key==='Enter'){routeOn=!routeOn}
  else if(e.key==='Escape'){ri=0;ui=0;routeOn=false;reqChanged=true}
  else return;
  e.preventDefault();render(reqChanged);
});
buildCompass();
render(false);
</script>
